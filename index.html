<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字幕燒錄工具｜瀏覽器端 MKV/MP4 轉檔</title>
<script src="coi-serviceworker.js"></script>
<script src="https://cdn.tailwindcss.com" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js" crossorigin="anonymous"></script>
<style>
  body{background:#eef1f4;color:#17212b;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
  .card{background:#fff;border:1px solid #d5dbe2;border-radius:14px;padding:1.25rem}
  .btn{background:#1d4e89;color:#fff;border-radius:10px;padding:.8rem 1.4rem;font-weight:600}
  .btn:disabled{background:#9aa8b8}
  .field{width:100%;border:1px solid #c3ccd6;border-radius:8px;padding:.6rem;background:#fff}
  .field:focus-visible,.btn:focus-visible{outline:3px solid #f0a020;outline-offset:2px}
</style>
</head>
<body class="min-h-screen">
<main class="max-w-3xl mx-auto p-4 sm:p-6 space-y-5">
  <header>
    <h1 class="text-2xl font-bold">字幕燒錄工具</h1>
    <p class="text-sm text-slate-600">全程在瀏覽器內以 FFmpeg.wasm 處理，影片不會上傳到任何伺服器。</p>
    <p id="env" class="text-xs mt-1"></p>
    <p class="text-xs text-slate-400">版本 v4-esm</p>
  </header>

  <section class="card space-y-3">
    <h2 class="font-semibold">步驟 1：選擇影片</h2>
    <input id="video" type="file" accept=".mkv,.mp4,.mov,video/*" class="field">
    <p id="vinfo" class="text-sm text-slate-600"></p>
  </section>

  <section class="card space-y-3">
    <h2 class="font-semibold">步驟 2：字幕設定</h2>
    <div class="flex gap-4 text-sm">
      <label><input type="radio" name="src" value="embedded" checked> 影片內建字幕軌</label>
      <label><input type="radio" name="src" value="external"> 外部 .srt 檔</label>
      <label><input type="radio" name="src" value="none"> 不燒錄字幕</label>
    </div>
    <div id="boxEmb">
      <select id="track" class="field" disabled><option>請先選擇影片</option></select>
      <p class="text-xs text-slate-500 mt-1">文字字幕（SRT/ASS）直接燒錄；圖像字幕（PGS/DVD）以疊加方式燒錄。</p>
    </div>
    <div id="boxExt" class="hidden"><input id="srt" type="file" accept=".srt" class="field"></div>
  </section>

  <section class="card space-y-3">
    <h2 class="font-semibold">步驟 3：輸出設定</h2>
    <div class="grid sm:grid-cols-3 gap-3">
      <label class="text-sm">解析度
        <select id="res" class="field"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="0">原始大小</option></select></label>
      <label class="text-sm">影像碼率 (kbps)
        <input id="vbr" type="number" min="300" step="100" value="5000" class="field"></label>
      <label class="text-sm">編碼速度
        <select id="preset" class="field"><option value="ultrafast" selected>最快（檔案較大）</option><option value="veryfast">較快</option><option value="medium">較慢（檔案較小）</option></select></label>
    </div>
    <div class="grid sm:grid-cols-3 gap-3 items-end">
      <label class="text-sm">字幕大小（佔影片高度 %）
        <input id="fsz" type="number" min="2" max="15" step="0.5" value="5.5" class="field"></label>
      <div class="flex gap-2 text-sm">
        <button type="button" class="field !w-auto" onclick="fsz.value=4">小 4</button>
        <button type="button" class="field !w-auto" onclick="fsz.value=5.5">中 5.5</button>
        <button type="button" class="field !w-auto" onclick="fsz.value=7">大 7</button>
      </div>
      <label class="text-sm"><input id="fass" type="checkbox"> 也套用到 ASS 字幕（覆寫內建樣式）</label>
    </div>
    <p class="text-xs text-slate-500">數值越大字越大；SRT 預設約 5.5。ASS 字幕預設保留原作者設定的大小。</p>
  </section>

  <section class="card space-y-3">
    <button id="go" class="btn w-full" disabled>開始轉換</button>
    <div class="flex items-center gap-3">
      <div class="flex-1 h-3 rounded-full bg-slate-200 overflow-hidden"><div id="bar" class="h-full bg-amber-500" style="width:0%"></div></div>
      <span id="pct" class="text-sm tabular-nums w-14 text-right">0%</span>
    </div>
    <p id="status" class="text-sm text-slate-600">等待影片…</p>
    <pre id="log" class="text-xs bg-slate-900 text-slate-100 rounded-lg p-3 h-44 overflow-auto whitespace-pre-wrap"></pre>
  </section>

  <section id="done" class="card space-y-3 hidden">
    <h2 class="font-semibold">完成</h2>
    <video id="player" controls playsinline class="w-full rounded-lg bg-black"></video>
    <a id="dl" class="btn inline-block text-center" download="output.mp4">下載 MP4</a>
  </section>
</main>

<script>
const { FFmpeg } = FFmpegWASM;
const { toBlobURL } = FFmpegUtil;
const $ = (id) => document.getElementById(id);
const errText = (e) => (e && (e.message || e.toString())) || String(e);
let ffmpeg = null;
let loaded = false, mounted = false, videoFile = null, tracks = [], logSink = null;
const FONT_URL = 'https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/SubsetOTF/TC/NotoSansTC-Regular.otf';

const isolated = window.crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined';
$('env').textContent = isolated ? '✔ 多執行緒已啟用' : '⚠ 尚未啟用多執行緒（首次載入後請重新整理一次），將使用單執行緒模式';

function makeFFmpeg() {
  const f = new FFmpeg();
  f.on('log', ({ message }) => {
    if (logSink) logSink.push(message);
    const l = $('log'); l.textContent += message + '\n'; l.scrollTop = l.scrollHeight;
  });
  f.on('progress', ({ progress }) => {
    const p = Math.max(0, Math.min(100, Math.round(progress * 100)));
    $('bar').style.width = p + '%'; $('pct').textContent = p + '%';
  });
  return f;
}
const logLine = (t) => { const l = $('log'); l.textContent += t + '\n'; l.scrollTop = l.scrollHeight; };

let diagDone = false;
// 在一個最小的 blob worker 內直接 importScripts，取得真正的失敗原因
function diagnose(url) {
  return new Promise((res) => {
    const code = `try{importScripts(${JSON.stringify(url)});postMessage('importScripts 成功，createFFmpegCore='+typeof createFFmpegCore)}catch(e){postMessage('importScripts 失敗：'+e.name+': '+e.message)}`;
    let w; const t = setTimeout(() => { try { w.terminate(); } catch {} res('診斷逾時'); }, 20000);
    try {
      w = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
      w.onmessage = (e) => { clearTimeout(t); w.terminate(); res(e.data); };
      w.onerror = (e) => { clearTimeout(t); w.terminate(); res('worker 錯誤：' + (e.message || '未知')); };
    } catch (e) { clearTimeout(t); res('無法建立 blob worker：' + errText(e)); }
  });
}
async function loadFFmpeg() {
  if (loaded) return;
  const v = '0.12.6', pkg = isolated ? 'core-mt' : 'core';
  const jsd = `https://cdn.jsdelivr.net/npm/@ffmpeg/${pkg}@${v}/dist/esm`;
  const unp = `https://unpkg.com/@ffmpeg/${pkg}@${v}/dist/esm`;
  const workerSrc = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js';
  const blobCfg = async (base, direct) => {
    const cfg = {
      coreURL: direct ? `${base}/ffmpeg-core.js` : await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript'),
      wasmURL: direct ? `${base}/ffmpeg-core.wasm` : await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm'),
      classWorkerURL: await toBlobURL(workerSrc, 'text/javascript'),
    };
    if (isolated) cfg.workerURL = await toBlobURL(`${base}/ffmpeg-core.worker.js`, 'text/javascript');
    return cfg;
  };
  // 本機備援（單執行緒核心）：先找 ./vendor/，再找網站根目錄
  const localCfg = (dir) => async () => {
    const u = (f) => new URL(dir + f, location.href).href;
    const r = await fetch(u('ffmpeg-core.wasm'), { method: 'HEAD' });
    if (!r.ok) throw new Error('找不到 ' + u('ffmpeg-core.wasm') + '（HTTP ' + r.status + '）');
    return { coreURL: u('ffmpeg-core.js'), wasmURL: u('ffmpeg-core.wasm'), classWorkerURL: u('814.ffmpeg.js') };
  };
  const strategies = [
    ['jsDelivr（blob）', () => blobCfg(jsd, false)],
    ['jsDelivr（直連核心）', () => blobCfg(jsd, true)],
    ['unpkg（blob）', () => blobCfg(unp, false)],
    ['本機 ./vendor/', localCfg('vendor/')],
    ['本機 根目錄', localCfg('')],
  ];
  const errs = [];
  for (const [name, build] of strategies) {
    $('status').textContent = `載入 FFmpeg 核心（${name}）… 約 30 MB，僅首次`;
    logLine(`[載入] 嘗試：${name}`);
    const f = makeFFmpeg();
    try {
      await f.load(await build());
      ffmpeg = f; loaded = true; logLine(`[載入] 成功：${name}`); return;
    } catch (e) {
      const m = `${name} → ${errText(e)}`; errs.push(m); logLine('[載入失敗] ' + m);
      try { f.terminate(); } catch {}
    }
  }
  throw new Error('所有載入方式都失敗：' + errs.join('；'));
}

// 以 WORKERFS 掛載，避免把整個影片複製進記憶體
async function mountVideo(file) {
  if (mounted) { try { await ffmpeg.unmount('/in'); } catch {} try { await ffmpeg.deleteDir('/in'); } catch {} }
  const ext = (file.name.match(/\.[^.]+$/) || ['.mkv'])[0].toLowerCase();
  try { await ffmpeg.createDir('/in'); } catch {}
  const ok = await ffmpeg.mount('WORKERFS', { files: [new File([file], 'input' + ext)] }, '/in');
  if (ok) { mounted = true; return '/in/input' + ext; }
  // 退而求其次：整檔寫入記憶體（較吃記憶體）
  $('log').textContent += '[提示] WORKERFS 不可用，改為整檔載入記憶體…\n';
  await ffmpeg.writeFile('/input' + ext, new Uint8Array(await file.arrayBuffer()));
  mounted = false;
  return '/input' + ext;
}

let inputPath = '';
function parseTracks(lines) {
  const out = []; let cur = null, idx = 0;
  for (const line of lines) {
    const m = line.match(/Stream #0:(\d+)(?:\(([^)]*)\))?[^:]*: Subtitle: (\w+)/);
    if (m) {
      cur = { stream: +m[1], si: idx++, lang: m[2] || 'und', codec: m[3], title: '' };
      cur.bitmap = ['hdmv_pgs_subtitle', 'dvd_subtitle', 'dvb_subtitle', 'xsub'].includes(cur.codec);
      out.push(cur); continue;
    }
    if (/Stream #0:\d+/.test(line)) { cur = null; continue; }
    const t = line.match(/^\s+title\s*:\s*(.+)$/);
    if (cur && t) cur.title = t[1].trim();
  }
  return out;
}

$('video').addEventListener('change', async (e) => {
  videoFile = e.target.files[0]; if (!videoFile) return;
  $('go').disabled = true; $('done').classList.add('hidden');
  $('vinfo').textContent = `${videoFile.name}（${(videoFile.size / 1048576).toFixed(1)} MB）`;
  const sel = $('track'); sel.disabled = true; sel.innerHTML = '<option>解析字幕軌中…</option>';
  try {
    await loadFFmpeg();
    $('status').textContent = '解析影片軌道…';
    // 軌道資訊在檔案開頭，只取前 48 MB 來探測，速度快且省記憶體
    const pext = (videoFile.name.match(/\.[^.]+$/) || ['.mkv'])[0].toLowerCase();
    const probe = '/probe' + pext;
    await ffmpeg.writeFile(probe, new Uint8Array(await videoFile.slice(0, 48 * 1048576).arrayBuffer()));
    logSink = [];
    await ffmpeg.exec(['-hide_banner', '-i', probe]); // 無輸出檔，會回傳錯誤碼，但軌道資訊已寫入日誌
    try { await ffmpeg.deleteFile(probe); } catch {}
    tracks = parseTracks(logSink); logSink = null;
    if (!tracks.length) sel.innerHTML = '<option value="">此影片沒有內建字幕軌</option>';
    else {
      sel.innerHTML = tracks.map((t, i) =>
        `<option value="${i}">Track #0:${t.stream} [${t.lang}] ${t.title ? '· ' + t.title + ' ' : ''}(${t.codec}${t.bitmap ? '，圖像' : ''})</option>`).join('');
      sel.disabled = false;
    }
    $('status').textContent = `已就緒，找到 ${tracks.length} 條字幕軌。`;
    $('go').disabled = false;
  } catch (err) {
    logSink = null; console.error(err); $('log').textContent += '[錯誤] ' + errText(err) + '\n'; $('status').textContent = '解析失敗：' + errText(err);
  }
});

document.querySelectorAll('input[name=src]').forEach((r) => r.addEventListener('change', () => {
  const v = document.querySelector('input[name=src]:checked').value;
  $('boxEmb').classList.toggle('hidden', v !== 'embedded');
  $('boxExt').classList.toggle('hidden', v !== 'external');
}));

async function ensureFont() {
  try {
    await ffmpeg.createDir('/fonts');
    $('status').textContent = '下載中文字型…';
    await ffmpeg.writeFile('/fonts/NotoSansTC.otf', new Uint8Array(await (await fetch(FONT_URL)).arrayBuffer()));
    return true;
  } catch (e) {
    try { await ffmpeg.listDir('/fonts'); return true; } catch {}
    $('log').textContent += '[警告] 字型下載失敗，中文可能顯示為方塊。\n'; return false;
  }
}

$('go').addEventListener('click', async () => {
  const src = document.querySelector('input[name=src]:checked').value;
  const h = +$('res').value, kbps = Math.max(300, +$('vbr').value || 2500);
  // 純文字字幕以 288 高為基準（libass 預設 PlayResY），換算成 FontSize
  const fsize = Math.round((Math.max(2, Math.min(15, +$('fsz').value || 5.5)) / 100) * 288 * 10) / 10;
  const fstyle = `:force_style='FontName=Noto Sans TC,FontSize=${fsize},Outline=2'`;
  const scale = h ? `scale=-2:min(${h}\\,ih)` : null;
  let args, filter = null, mapV = [];
  try {
    $('go').disabled = true; $('done').classList.add('hidden');
    $('status').textContent = '準備影片…';
    inputPath = await mountVideo(videoFile);
    args = ['-hide_banner', '-i', inputPath];
    $('bar').style.width = '0%'; $('pct').textContent = '0%';

    if (src === 'embedded') {
      const t = tracks[+$('track').value];
      if (!t) throw new Error('請選擇字幕軌，或改選其他字幕來源。');
      if (t.bitmap) {
        args.push('-filter_complex', `[0:v:0][0:s:${t.si}]overlay${scale ? ',' + scale : ''}[v]`);
        mapV = ['-map', '[v]'];
      } else {
        await ensureFont();
        const isAss = t.codec === 'ass' || t.codec === 'ssa';
        const style = isAss && !$('fass').checked ? '' : fstyle;
        filter = `subtitles=${inputPath}:si=${t.si}:fontsdir=/fonts${style}`;
      }
    } else if (src === 'external') {
      const f = $('srt').files[0]; if (!f) throw new Error('請先選擇 .srt 檔案。');
      await ensureFont();
      await ffmpeg.writeFile('/sub.srt', new Uint8Array(await f.arrayBuffer()));
      filter = 'subtitles=/sub.srt:fontsdir=/fonts' + fstyle;
    }
    if (filter) args.push('-vf', [filter, scale].filter(Boolean).join(','));
    else if (!mapV.length && scale) args.push('-vf', scale);
    if (mapV.length) args.push(...mapV, '-map', '0:a:0?');
    else args.push('-map', '0:v:0', '-map', '0:a:0?');

    args.push('-c:v', 'libx264', '-preset', $('preset').value, '-b:v', kbps + 'k', '-pix_fmt', 'yuv420p',
      '-c:a', 'aac', '-b:a', '128k', '-movflags', '+faststart', '-threads', isolated ? '0' : '1', '-y', 'out.mp4');

    $('status').textContent = '轉換中，請保持此頁面在前景…';
    $('log').textContent += '> ffmpeg ' + args.join(' ') + '\n';
    const t0 = performance.now();
    const code = await ffmpeg.exec(args);
    if (code !== 0) throw new Error('FFmpeg 結束碼 ' + code + '，請查看日誌。');
    const data = await ffmpeg.readFile('out.mp4');
    await ffmpeg.deleteFile('out.mp4');
    const url = URL.createObjectURL(new Blob([data.buffer], { type: 'video/mp4' }));
    $('player').src = url; $('dl').href = url;
    $('dl').download = videoFile.name.replace(/\.[^.]+$/, '') + '_subbed.mp4';
    $('done').classList.remove('hidden'); $('bar').style.width = '100%'; $('pct').textContent = '100%';
    $('status').textContent = `完成，耗時 ${((performance.now() - t0) / 1000).toFixed(0)} 秒。`;
    $('done').scrollIntoView({ behavior: 'smooth' });
  } catch (err) {
    console.error(err); $('log').textContent += '[錯誤] ' + errText(err) + '\n'; $('status').textContent = '錯誤：' + errText(err);
  } finally { $('go').disabled = false; }
});
</script>
</body>
</html>
